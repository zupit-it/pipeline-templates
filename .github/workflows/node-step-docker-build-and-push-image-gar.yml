name: Docker build and push node image to Google Artifact Registry

on:
  workflow_call:
    inputs:
      RUN_ON:
        required: false
        type: string
        default: "zupit-agents"
      RUNNERS_CONTAINER_GROUP:
        required: false
        type: string
        default: "Container"
      DIND_IMAGE:
        required: false
        type: string
        default: "docker:26.0.0-dind"
      NODE_VERSION:
        required: true
        type: string
      RELEASE_ENVIRONMENT:
        required: true
        type: string
      WORKING_DIRECTORY:
        required: true
        type: string
      DOCKERFILE_PATH:
        required: true
        type: string
      DOCKER_IMAGE_NAME:
        required: true
        type: string
      DOCKER_IMAGE_TAG:
        required: true
        type: string
      BUILD_ARGS:
        required: false
        type: string
        default: ""
      GCP_PROJECT_ID:
        required: true
        type: string
      GAR_LOCATION:
        required: true
        type: string
      GAR_REPOSITORY:
        required: true
        type: string
      ARTIFACT_NAME:
        required: false
        type: string
        default: node-build
      ENV_VARIABLES:
        required: false
        type: string
        default: "{}"
      PROJECT:
        required: false
        type: string
        default: ""
      IMAGE:
        required: false
        type: string
        default: "ubuntu:23.04"
      DIST_PATH:
        required: true
        type: string
      CHECKOUT_REF:
        required: false
        type: string
        default: ""
      ENVIRONMENT:
        required: false
        type: string
        default: ""

    outputs:
      DOCKER_IMAGE_NAME:
        description: "The docker image name that has been built"
        value: ${{ jobs.docker-build-and-push.outputs.DOCKER_IMAGE_NAME }}

env: "${{secrets}}"

jobs:
  build-node-project:
    runs-on:
      labels: ${{ inputs.RUN_ON }}
      group: ${{ inputs.RUNNERS_CONTAINER_GROUP }}
    container:
      image: ${{ inputs.IMAGE }}

    env: ${{ fromJson(inputs.ENV_VARIABLES) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.CHECKOUT_REF }}

      - name: NodeJS Build
        uses: zupit-it/pipeline-templates/.github/actions/node/build@v1.36.0
        with:
          NODE_VERSION: ${{ inputs.NODE_VERSION }}
          RELEASE_ENVIRONMENT: ${{ inputs.RELEASE_ENVIRONMENT }}
          WORKING_DIRECTORY: ${{ inputs.WORKING_DIRECTORY }}
          PROJECT: ${{ inputs.PROJECT }}
        env: "${{secrets}}"

      - name: Archive build
        run: tar czvf dist.tar.gz ${{ inputs.WORKING_DIRECTORY }}/${{ inputs.DIST_PATH }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ARTIFACT_NAME }}
          path: dist.tar.gz
          retention-days: 1

  docker-build-and-push:
    environment: ${{ inputs.ENVIRONMENT }}
    runs-on:
      labels: ${{ inputs.RUN_ON }}
      group: ${{ inputs.RUNNERS_CONTAINER_GROUP }}
    container:
      image: ${{ inputs.DIND_IMAGE }}

    outputs:
      DOCKER_IMAGE_NAME: ${{ steps.docker.outputs.DOCKER_IMAGE_NAME }}

    env: ${{ fromJson(inputs.ENV_VARIABLES) }}

    needs: [build-node-project]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.CHECKOUT_REF }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.ARTIFACT_NAME }}
          path: .

      - name: Unpack build
        run: tar xzvf dist.tar.gz

      - name: Docker Build & Push to GAR
        id: docker
        uses: zupit-it/pipeline-templates/.github/actions/docker/build-and-push-gar@v1.36.0
        with:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
          GAR_LOCATION: ${{ inputs.GAR_LOCATION }}
          GCP_PROJECT_ID: ${{ inputs.GCP_PROJECT_ID }}
          GAR_REPOSITORY: ${{ inputs.GAR_REPOSITORY }}
          WORKING_DIRECTORY: ${{ inputs.WORKING_DIRECTORY }}
          DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}
          DOCKER_IMAGE_NAME: ${{ inputs.DOCKER_IMAGE_NAME }}
          DOCKER_IMAGE_TAG: ${{ inputs.DOCKER_IMAGE_TAG }}
          BUILD_ARGS: ${{ inputs.BUILD_ARGS }}
        env: "${{secrets}}"
